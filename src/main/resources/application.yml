spring:
  application.name: dutoom-shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dutoom}
    username: ${DB_USER:dutoom}
    password: ${DB_PASSWORD:dutoom}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate   # 스키마는 Flyway만 변경 (DB 초기화 금지)
  flyway:
    locations: classpath:db/migration
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 12MB
  thymeleaf.cache: ${THYMELEAF_CACHE:true}
  web.resources.cache.cachecontrol.max-age: 7d
server:
  forward-headers-strategy: framework
  compression.enabled: true
  servlet.session.timeout: 2h

# 운영 정보: 환경변수로 주입. 값이 비어 있으면 화면에 "확인 필요"로 노출된다.
shop:
  base-url: ${SHOP_BASE_URL:http://localhost:8080}
  upload-dir: ${SHOP_UPLOAD_DIR:./uploads}
  shipping-fee: ${SHOP_SHIPPING_FEE:4000}
  free-shipping-over: ${SHOP_FREE_SHIPPING_OVER:100000}
  company:
    name: ${COMPANY_NAME:}
    ceo: ${COMPANY_CEO:}
    business-no: ${COMPANY_BUSINESS_NO:}
    mail-order-no: ${COMPANY_MAIL_ORDER_NO:}
    address: ${COMPANY_ADDRESS:}
    phone: ${COMPANY_PHONE:}
    email: ${COMPANY_EMAIL:}
    cs-hours: ${COMPANY_CS_HOURS:}
  payment:
    mode: ${PAYMENT_MODE:mock}           # mock | toss
    toss-client-key: ${TOSS_CLIENT_KEY:}
    toss-secret-key: ${TOSS_SECRET_KEY:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # 메인 BRAND BENEFITS / TRUST 문구. 실제 제공 여부 확인 전까지 임시 문구(temp: true)로 관리
  benefits:
    - { icon: eel,   title: 엄선된 프리미엄 장어,   sub: 까다로운 선별 기준, temp: true }
    - { icon: knife, title: 정교한 손질과 품질관리, sub: 장인의 노하우,     temp: true }
    - { icon: truck, title: 신선한 배송 시스템,     sub: 최상의 신선도로,   temp: true }
    - { icon: gift,  title: 특별한 선물 패키지,     sub: 마음을 전하는 품격, temp: true }
  trust:
    - { icon: badge, title: 품질관리,    sub: 까다로운 품질 기준,      temp: true }
    - { icon: lock,  title: 안전한 결제, sub: 안심하고 구매하세요,     temp: true }
    - { icon: leaf,  title: 신선 배송,   sub: 신선함 그대로 전달,      temp: true }
    - { icon: phone, title: 고객 상담,   sub: "",                     temp: true }
  # 멀티 브랜드는 DB(brands 테이블)에서 관리: 관리자 > 브랜드
---
spring.config.activate.on-profile: local
spring:
  flyway.locations: classpath:db/migration,classpath:db/sample
  flyway.out-of-order: true   # 샘플(V100~)이 먼저 적용된 로컬 DB에 새 본 마이그레이션(V4~) 적용 허용
  thymeleaf.cache: false
shop:
  company:   # [샘플] 화면 확인용
    name: ${COMPANY_NAME:두툼장어 (샘플)}
    ceo: ${COMPANY_CEO:홍길동}
    business-no: ${COMPANY_BUSINESS_NO:000-00-00000}
    mail-order-no: ${COMPANY_MAIL_ORDER_NO:제2026-서울강남-0000호}
    address: ${COMPANY_ADDRESS:서울특별시 강남구 테헤란로 123}
    phone: ${COMPANY_PHONE:1588-0000}
    email: ${COMPANY_EMAIL:help@dutoom.local}
    cs-hours: ${COMPANY_CS_HOURS:평일 10:00~17:00}
  admin:
    email: ${ADMIN_EMAIL:admin@dutoom.local}
    password: ${ADMIN_PASSWORD:admin1234!}
