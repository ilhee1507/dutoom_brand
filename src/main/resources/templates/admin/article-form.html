<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 | ' + ${brand.name()}, '두툼장어 관리자')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-light">
<div class="page" style="max-width:1240px">
<nav style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px;font-weight:600">
  <a href="/admin">대시보드</a><a href="/admin/products">상품</a><a href="/admin/brands">브랜드</a><a href="/admin/orders">주문/배송</a><a href="/admin/articles">콘텐츠</a><a href="/admin/inquiries">문의</a><a href="/admin/reviews">후기</a>
</nav>
<div class="page-head"><h1 th:text="${(a.id == null ? '추가: ' : '수정: ') + (a.type == 'STORY' ? (a.mainStory ? '대표 브랜드 스토리' : '브랜드 스토리') : '가이드')}"></h1>
<p><a href="/admin/articles" style="text-decoration:underline">목록으로</a><th:block th:if="${a.id != null}"> · <a th:href="${a.path}" target="_blank" style="text-decoration:underline">페이지 보기</a></th:block></p></div>
<form th:action="@{/admin/articles}" method="post" enctype="multipart/form-data" class="box form-grid">
<input type="hidden" name="id" th:value="${a.id}"><input type="hidden" name="type" th:value="${a.type}">
<div class="two">
<div class="field" th:unless="${a.mainStory}"><label>주소 (slug)</label><input name="slug" th:value="${a.slug}" required pattern="[a-z0-9\-]{2,80}" th:placeholder="${a.type == 'STORY' ? '예) our-farm' : '예) eel-salad'}"><p class="hint">영문 소문자·숫자·- 사용. 페이지 주소: <span th:text="${a.type == 'STORY' ? '/story/' : '/guide/'}"></span><b>slug</b></p></div>
<div class="field" th:if="${a.mainStory}"><label>주소</label><input value="/story" disabled><p class="hint">대표 브랜드 스토리는 고정 페이지이며 메인에 노출됩니다.</p></div>
<div class="field"><label>노출 순서</label><input type="number" name="sort" th:value="${a.sort}" min="0" max="9999"><p class="hint" th:text="${a.type == 'STORY' ? '작을수록 앞. /story 하단 「브랜드 이야기 더 보기」 순서입니다.' : '작을수록 앞. 메인에는 가이드 앞쪽 3개가 노출됩니다.'}"></p></div>
</div>
<div class="field"><label>제목 (줄바꿈 가능)</label><textarea name="title" required style="min-height:80px" th:text="${a.title}"></textarea></div>
<div class="field"><label>요약 (메인/검색 설명)</label><textarea name="summary" style="min-height:80px" th:text="${a.summary}"></textarea></div>
<div class="field"><label>본문</label><textarea name="body" style="min-height:320px" th:text="${a.body}"></textarea></div>
<div class="field"><label>대표 이미지</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp"><input name="imageUrl" th:value="${a.imageUrl}" style="margin-top:6px"></div>
<label class="check"><input type="checkbox" name="published" value="true" th:checked="${a.published}"> 공개</label>
<button class="btn btn-burgundy" type="submit">저장</button></form>
<form th:if="${a.id != null and !a.mainStory}" th:action="@{/admin/articles/{id}/delete(id=${a.id})}" method="post" style="margin-top:16px;text-align:right"
      onsubmit="return confirm('이 콘텐츠를 삭제할까요? 되돌릴 수 없습니다.')"><button class="btn btn-outline" type="submit" style="color:#8a2a2a;border-color:#c9a3a3">삭제</button></form>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
