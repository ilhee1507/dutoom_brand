<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 | ' + ${brand.name()}, '두툼장어 관리자')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-light">
<div class="page" style="max-width:1240px">
<nav style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px;font-weight:600">
  <a href="/admin">대시보드</a><a href="/admin/products">상품</a><a href="/admin/brands">브랜드</a><a href="/admin/orders">주문/배송</a><a href="/admin/articles">콘텐츠</a><a href="/admin/inquiries">문의</a><a href="/admin/reviews">후기</a>
</nav>
<div class="page-head" style="display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap"><div><h1>콘텐츠 관리</h1><p>브랜드 스토리와 맛있게 즐기는 법 콘텐츠를 추가·수정·삭제합니다.</p></div>
<div style="display:flex;gap:8px"><a href="/admin/articles/new?type=STORY" class="btn btn-brown">브랜드 스토리 추가</a><a href="/admin/articles/new?type=GUIDE" class="btn btn-burgundy">가이드 추가</a></div></div>
<div class="box table-wrap"><table class="table"><thead><tr><th>순서</th><th>구분</th><th>제목</th><th>주소</th><th>수정일</th><th>공개</th><th></th></tr></thead>
<tbody><tr th:each="a : ${items}"><td th:text="${a.sort}"></td><td th:text="${a.type == 'STORY' ? (a.mainStory ? '브랜드 스토리 (대표)' : '브랜드 스토리') : '가이드'}"></td>
<td><a th:href="@{/admin/articles/{id}(id=${a.id})}" th:text="${a.title}" style="text-decoration:underline"></a></td>
<td><a th:href="${a.path}" th:text="${a.path}" target="_blank"></a></td>
<td th:text="${#temporals.format(a.updatedAt, 'yyyy.MM.dd')}"></td><td th:text="${a.published ? '공개' : '비공개'}"></td>
<td><a th:href="@{/admin/articles/{id}(id=${a.id})}">수정</a>
<form th:unless="${a.mainStory}" th:action="@{/admin/articles/{id}/delete(id=${a.id})}" method="post" style="display:inline"
      onsubmit="return confirm('이 콘텐츠를 삭제할까요? 되돌릴 수 없습니다.')"> · <button type="submit" style="background:none;border:0;padding:0;color:#8a2a2a;cursor:pointer;font:inherit">삭제</button></form></td></tr></tbody></table></div>
</div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
