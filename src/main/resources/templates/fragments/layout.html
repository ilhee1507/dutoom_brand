<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* 공통 head: 페이지별 title / description, canonical, OG, JSON-LD */-->
<head th:fragment="head(title, desc)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">두툼장어</title>
    <meta name="description" th:content="${desc}">
    <link rel="canonical" th:href="${canonical}">
    <meta th:if="${noindex}" name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="${brand.name()}">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${desc}">
    <meta property="og:url" th:content="${canonical}">
    <meta property="og:image" th:content="${shop.baseUrl() + (ogImage != null ? ogImage : '/images/hero-1.jpg')}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#080808">
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/css/app.css">
    <script th:if="${jsonLd}" type="application/ld+json" th:utext="${jsonLd}"></script>
    <script src="/js/app.js" defer></script>
</head>
<body>

<!--/* 로고: 향후 교체를 위해 독립 fragment로 관리 */-->
<a th:fragment="logo" th:href="'/' + ${brandQuery}" class="logo"><img th:if="${brand.logo() != null}" th:src="${brand.logo().src()}" th:alt="${brand.logo().alt()}" width="640" height="408"><span th:unless="${brand.logo() != null}" class="logo-text" th:text="${brand.name()}"></span></a>

<header th:fragment="header" class="site-header" id="top">
    <div class="header-inner">
        <a th:replace="~{fragments/layout :: logo}"></a>
        <nav class="gnb" id="gnb" aria-label="주요 메뉴">
            <a th:href="${brand.storyPath() + brandQuery}">브랜드 스토리</a>
            <a th:href="'/products' + ${brandQuery}" th:text="${brand.productTitle()}">프리미엄 장어</a>
            <a th:href="'/gifts' + ${brandQuery}">선물세트</a>
            <a th:if="${brand.guides()}" href="/guide">맛있게 즐기는 법</a>
            <a th:href="'/reviews' + ${brandQuery}">고객 후기</a>
            <div class="gnb-extra">
                <a sec:authorize="isAnonymous()" href="/login">로그인</a>
                <a sec:authorize="isAnonymous()" href="/order/lookup">비회원 주문조회</a>
                <a sec:authorize="isAuthenticated()" href="/mypage">마이페이지</a>
                <a sec:authorize="hasRole('ADMIN')" href="/admin">관리자</a>
                <a href="/inquiry">고객 문의</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
            </div>
        </nav>
        <div class="util">
            <button type="button" class="icon-btn" data-search-toggle aria-label="검색"><svg><use href="#i-search"/></svg></button>
            <a class="icon-btn" href="/mypage" aria-label="마이페이지"><svg><use href="#i-user"/></svg></a>
            <a class="icon-btn cart-btn" href="/cart" aria-label="장바구니"><svg><use href="#i-bag"/></svg><span class="badge" th:text="${cartCount}">0</span></a>
            <button type="button" class="icon-btn menu-btn" data-menu-toggle aria-label="메뉴 열기" aria-controls="gnb" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        </div>
    </div>
    <form class="search-bar" action="/search" method="get" role="search" hidden>
        <input type="search" name="q" placeholder="상품명을 입력하세요" aria-label="상품 검색">
        <button type="submit" class="btn btn-gold">검색</button>
    </form>
    <div class="flash" th:if="${message}" th:text="${message}" role="status"></div>
    <div class="flash flash-error" th:if="${error}" th:text="${error}" role="alert"></div>
</header>

<footer th:fragment="footer" class="site-footer">
    <div class="footer-inner">
        <div class="footer-brand">
            <a th:replace="~{fragments/layout :: logo}"></a>
            <p class="footer-slogan" th:text="${brand.heroTitle() + ' ' + brand.heroAccent()}">두툼한 한 점, 깊이 있는 품격</p>
        </div>
        <dl class="footer-info" th:with="c=${shop.company()}, tbd='확인 필요'">
            <div><dt>상호</dt><dd th:text="${#strings.isEmpty(c.name()) ? tbd : c.name()}"></dd></div>
            <div><dt>대표자</dt><dd th:text="${#strings.isEmpty(c.ceo()) ? tbd : c.ceo()}"></dd></div>
            <div><dt>사업자등록번호</dt><dd th:text="${#strings.isEmpty(c.businessNo()) ? tbd : c.businessNo()}"></dd></div>
            <div><dt>통신판매업 신고</dt><dd th:text="${#strings.isEmpty(c.mailOrderNo()) ? tbd : c.mailOrderNo()}"></dd></div>
            <div class="wide"><dt>사업장 주소</dt><dd th:text="${#strings.isEmpty(c.address()) ? tbd : c.address()}"></dd></div>
            <div><dt>고객센터</dt><dd><span th:text="${#strings.isEmpty(c.phone()) ? tbd : c.phone()}"></span><span th:if="${!#strings.isEmpty(c.csHours())}" th:text="' · ' + ${c.csHours()}"></span></dd></div>
            <div><dt>이메일</dt><dd th:text="${#strings.isEmpty(c.email()) ? tbd : c.email()}"></dd></div>
        </dl>
        <nav class="footer-links" aria-label="정책">
            <a href="/policy/privacy"><strong>개인정보처리방침</strong></a>
            <a href="/policy/terms">이용약관</a>
            <a href="/policy/shipping">배송 및 교환 안내</a>
            <a href="/inquiry">고객 문의</a>
            <a href="/order/lookup">비회원 주문조회</a>
        </nav>
    </div>
    <p class="copyright" th:text="${'© ' + (brands.isDefault(brand) ? 'DUTOOM EEL' : brand.name()) + '. All rights reserved.'}">© DUTOOM EEL. All rights reserved.</p>
</footer>

<!--/* 아이콘 스프라이트: 동일 두께(1.4) 라인 스타일 */-->
<svg th:fragment="icons" xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M10 8v8M14 8v8"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M10 8l6 4-6 4V8Z"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 5h2l2 10h11l2-7H7"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></symbol>
    <!-- benefits / trust -->
    <symbol id="i-eel" viewBox="0 0 40 40"><path d="M20 4 33 11v18l-13 7-13-7V11Z"/><path d="M12 22c3-4 6-5 9-2s5 3 8-1"/><circle cx="27" cy="18" r=".8"/><path d="M20 4v4M20 32v4"/></symbol>
    <symbol id="i-knife" viewBox="0 0 40 40"><path d="M9 31 27 9c3-2 5 0 4 3L15 33"/><path d="M15 33l-4 2-2-4"/><path d="M19 22l4 4"/></symbol>
    <symbol id="i-truck" viewBox="0 0 40 40"><path d="M4 11h20v16H4z"/><path d="M24 16h7l5 6v5H24"/><circle cx="11" cy="29" r="3"/><circle cx="29" cy="29" r="3"/><path d="M10 17c2-2 4-2 6 0s4 2 5 0"/></symbol>
    <symbol id="i-gift" viewBox="0 0 40 40"><path d="M7 16h26v6H7zM9 22h22v13H9z"/><path d="M20 16v19"/><path d="M20 16c-2-5-9-7-9-2 0 2 4 2 9 2Zm0 0c2-5 9-7 9-2 0 2-4 2-9 2Z"/></symbol>
    <symbol id="i-box" viewBox="0 0 40 40"><path d="M6 13 20 6l14 7v15l-14 7-14-7Z"/><path d="M6 13l14 7 14-7M20 20v15"/><path d="M13 9.5l14 7"/></symbol>
    <symbol id="i-card" viewBox="0 0 40 40"><rect x="6" y="9" width="28" height="22" rx="1"/><path d="M11 25c3-5 6-6 9-3s6 2 9-2"/><path d="M11 15h10"/></symbol>
    <symbol id="i-deliver" viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/><path d="M13 22h9l3-4h3"/><path d="M15 26c3 1 7 1 10-1"/><path d="M20 6v3"/></symbol>
    <symbol id="i-badge" viewBox="0 0 40 40"><path d="m20 4 4 4h6v6l4 4-4 4v6h-6l-4 4-4-4h-6v-6l-4-4 4-4V8h6Z"/><path d="m15 20 3.5 3.5L26 16"/></symbol>
    <symbol id="i-lock" viewBox="0 0 40 40"><rect x="9" y="17" width="22" height="18" rx="1.5"/><path d="M14 17v-4a6 6 0 0 1 12 0v4"/><path d="M16 25l4 3 4-3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 40 40"><path d="M9 31C9 17 17 9 32 8c0 15-8 23-22 23Z"/><path d="M9 31 24 16"/></symbol>
    <symbol id="i-phone" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><path d="M15 13c-1 1-2 3 0 6s5 6 8 8 4 0 5-1l-3-3-2 1c-2-1-4-3-5-5l1-2Z"/></symbol>
</svg>
</body>
</html>
