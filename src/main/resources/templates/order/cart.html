<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('장바구니 | ' + ${brand.name()}, '두툼장어 장바구니')}"></head>
<body>
<svg th:replace="~{fragments/layout :: icons}"></svg>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-light">
    <div class="page">
        <div class="page-head"><p class="eyebrow">CART</p><h1>장바구니</h1></div>
        <p class="empty" th:if="${lines.isEmpty()}">장바구니가 비어 있습니다.<br><br><a href="/products" class="btn btn-burgundy">프리미엄 장어 보기</a></p>
        <div class="checkout cart-grid" th:unless="${lines.isEmpty()}">
            <div class="box table-wrap">
                <table class="table">
                    <thead><tr><th>상품</th><th>수량</th><th class="num">금액</th></tr></thead>
                    <tbody>
                    <tr th:each="l : ${lines}">
                        <td><a th:href="${l.product().path}" th:text="${l.product().name}" style="font-weight:600"></a>
                            <div th:if="${l.option() != null}" th:text="${l.option().name}" style="font-size:13px;color:#8a8077"></div></td>
                        <td>
                            <form th:action="@{/cart/update}" method="post" style="display:flex;gap:6px;align-items:center">
                                <input type="hidden" name="index" th:value="${l.index()}">
                                <input type="number" name="quantity" th:value="${l.quantity()}" min="0" max="99" style="width:64px;min-height:38px;padding:0 8px;border:1px solid #d6cdc0" aria-label="수량">
                                <button class="btn btn-dark" style="min-height:38px;padding:0 12px;font-size:13px">변경</button>
                            </form>
                            <form th:action="@{/cart/update}" method="post" style="margin-top:6px">
                                <input type="hidden" name="index" th:value="${l.index()}"><input type="hidden" name="quantity" value="0">
                                <button style="background:none;border:0;padding:0;font-size:12.5px;color:#a3262f;cursor:pointer">삭제</button>
                            </form>
                        </td>
                        <td class="num" th:text="${#numbers.formatInteger(l.lineTotal(), 1, 'COMMA')} + '원'"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <aside class="box summary-box"><th:block th:insert="~{order/checkout :: totals}"></th:block>
                <a href="/checkout" class="btn btn-burgundy btn-block" style="min-height:56px;margin-top:auto">주문하기</a></aside>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
